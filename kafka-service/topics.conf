# Single source of truth for Kafka topics. Read by init-topics.sh.
# Format: <topic> <partitions> <retention_ms> <retention_bytes_per_partition>
# Add a line to add a topic. The init script only creates missing topics; it never
# alters or deletes existing ones (see README to change an existing topic).
#
# Partitions are fixed at creation and can only be increased later. Retention is
# 7 days (604800000 ms) with a 1 GiB per-partition size cap (1073741824 bytes).
intent.checkout 2 604800000 1073741824
intent.atc      2 604800000 1073741824
intent.click    3 604800000 1073741824
intent.other    3 604800000 1073741824
intent.dlq      1 604800000 1073741824