version: "3.9"

services:
  api-gateway:
    container_name: api-gateway-main
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8081:18080"
    env_file:
      - .env
      - ./api-gateway/.env
    environment:
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
    depends_on:
      auth-service:
        condition: service_healthy
      tenant-router:
        condition: service_healthy
      merchant-requests-service:
        condition: service_healthy
      alerts-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      daily-insights-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - saas-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:18080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  auth-service:
    container_name: auth-service-main
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.auth
    env_file:
      - .env
      - ./api-gateway/.env
    environment:
      PORT: 3001
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - saas-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:3001/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  tenant-router:
    container_name: tenant-router-main
    build:
      context: ./tenant-router
      dockerfile: Dockerfile
    env_file:
      - .env
      - ./tenant-router/.env
    environment:
      PORT: 3004
      NODE_ENV: production
      
    restart: unless-stopped
    networks:
      - saas-net
      - shared-net
    
    
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:3004/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  alerts-service:
    container_name: alerts-service-main
    build:
      context: ./alerts-service
      dockerfile: Dockerfile
    env_file:
      - .env
      - ./alerts-service/.env
    environment:
      PORT: 5005
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - saas-net
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:5005/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  merchant-requests-service:
    container_name: merchant-requests-service-main
    build:
      context: ./merchant-requests-service
      dockerfile: Dockerfile
    env_file:
      - .env
      - ./merchant-requests-service/.env
    environment:
      PORT: 4020
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - saas-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:4020/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  daily-insights-service:
    container_name: daily-insights-service-main
    build:
      context: ./daily-insights-service
      dockerfile: Dockerfile
    env_file:
      - .env
      - ./daily-insights-service/.env
    environment:
      PORT: 4030
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - saas-net
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:4030/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  analytics-service:
    container_name: analytics-service-main
    build:
      context: ./analytics
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    env_file:
      - .env
      - ./analytics/.env
    environment:
      PORT: 3006
      NODE_ENV: production


    restart: unless-stopped

    # 🔥 CRITICAL: attach to BOTH networks
    networks:
      - saas-net
      - shared-net

    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:3006/health', res => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sessions-service:
    container_name: sessions-service-main
    build:
      context: ./sessions-service
      dockerfile: Dockerfile
    env_file:
      - .env
      - ./sessions-service/.env

    environment:
      PORT: 4010
      NODE_ENV: production
      SESSION_WINDOW_MINUTES: 30
    restart: unless-stopped
    networks:
      - saas-net
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4010/health', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s


  # ---- Kafka (infrastructure only; single broker, KRaft, internal network only) ----
  # No host ports are published. Clients reach it as kafka-service:9092 on pipeline-net.
  kafka-service:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-3.9.1}
    container_name: kafka-service-main
    hostname: kafka-service
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-service:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx512m}
    expose:
      - "9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: ${KAFKA_MEM_LIMIT:-1g}
    restart: unless-stopped
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: creates the topics in kafka-service/topics.conf once the broker is healthy,
  # then exits 0. Safe on every `up` (existing topics are left as they are).
  kafka-init:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-3.9.1}
    container_name: kafka-init-main
    depends_on:
      kafka-service:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-service:9092}
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
    volumes:
      - ./kafka-service/topics.conf:/config/topics.conf:ro
      - ./kafka-service/init-topics.sh:/config/init-topics.sh:ro
    entrypoint: ["sh", "/config/init-topics.sh"]
    restart: "no"
    networks:
      - pipeline-net

volumes:
  kafka-data:
    name: kafka-data-main

networks:
  saas-net:
    name: saas-net-main
    driver: bridge

  # 🔥 ADD THIS
  shared-net:
    external: true

  # Created outside compose (also used by intent-pipeline): docker network create pipeline-net
  pipeline-net:
    external: true
