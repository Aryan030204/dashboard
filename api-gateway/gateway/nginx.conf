env GATEWAY_SHARED_SECRET;
env RATE_LIMIT_DISABLED;
env X_PIPELINE_KEY;
env PIPELINE_AUTH_HEADER;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Lua search path and cache
    lua_package_path "$prefix/gateway/lua/?.lua;$prefix/gateway/lua/resty/?.lua;$prefix/lualib/?.lua;$prefix/lualib/?/init.lua;;";
    lua_package_cpath "$prefix/lualib/?.so;$prefix/lualib/loadall.so;;";
    lua_code_cache on;

    default_type application/json;

    lua_shared_dict jwks_cache 1m;
    lua_shared_dict jwt_cache 10m;
    lua_shared_dict rate_limit_store 10m;

    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format timed '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '$request_time $upstream_response_time '
                     '"$http_referer" "$http_user_agent"';

    access_log /dev/stdout timed;
    error_log  /dev/stderr info;

    upstream auth_service {
        server auth-service:3001;
    }

    upstream analytics_service {
        server analytics-service:3006;
    }

    upstream alerts_service {
        server alerts-service:5005;
    }

    upstream merchant_requests_service {
        server merchant-requests-service:4020;
    }

    upstream tenant_router {
        server tenant-router:3004;
    }

    upstream sessions_service {
        server sessions-service:4010;
    }

    upstream daily_insights_service {
        server daily-insights-service:4030;
    }

    # health-monitor-service is deployed via a separate compose file with no
    # depends_on ordering against this gateway, so a static `upstream` block
    # (resolved once at nginx startup) would crash-loop the whole gateway if
    # that container isn't up yet. It's resolved per-request instead, via the
    # `resolver` directive above + a `set` variable in each location block
    # below — nginx starts regardless, and requests just 502 until the
    # service is reachable.


    server {
        listen 18080;
        server_name localhost;

        location /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # -------- PUBLIC AUTH ROUTES --------
        location /auth/ {
            access_by_lua_block {
                local ratelimit = require("ratelimit")
                ratelimit.enforce()
            }

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -------- TENANT ROUTER SOCKET.IO --------
        # Supports both direct gateway paths and /api-prefixed paths.
        # Keep this above the generic tenant locations.
        location ^~ /tenant/socket.io {
            proxy_pass http://tenant_router/api/tenant/socket.io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location ^~ /api/tenant/socket.io {
            proxy_pass http://tenant_router/api/tenant/socket.io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # -------- MERCHANT REQUESTS SOCKET.IO --------
        location ^~ /api/merchant-requests/socket.io {
            proxy_pass http://merchant_requests_service/api/merchant-requests/socket.io;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # -------- TODOIST WEBHOOK (service verifies HMAC) --------
        location = /merchant-requests/todoist/webhook {
            access_by_lua_block {
                local ratelimit = require("ratelimit")
                ratelimit.enforce()
            }

            proxy_pass http://merchant_requests_service/merchant-requests/todoist/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -------- MERCHANT REQUESTS --------
        location = /merchant-requests {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            proxy_pass http://merchant_requests_service/merchant-requests;
        }

        location /merchant-requests/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            proxy_pass http://merchant_requests_service;
        }

        location = /api/merchant-requests {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://merchant_requests_service;
        }

        location /api/merchant-requests/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://merchant_requests_service;
        }

        # -------- DAILY INSIGHTS --------
        location = /daily-insights {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            proxy_pass http://daily_insights_service/daily-insights;
        }

        location /daily-insights/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            proxy_pass http://daily_insights_service;
        }

        location = /api/daily-insights {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://daily_insights_service;
        }

        location /api/daily-insights/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://daily_insights_service;
        }

        # -------- HEALTH MONITOR (read-only) --------
        location = /health-monitor {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            # Note: since $health_monitor_upstream is a variable, nginx cannot
            # do location-prefix URI replacement here — it forwards the
            # original request URI as-is, which for this exact-match location
            # is already "/health-monitor", so no explicit suffix is needed.
            set $health_monitor_upstream "http://health-monitor-service:4015";
            proxy_pass $health_monitor_upstream;
        }

        location /health-monitor/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            set $health_monitor_upstream "http://health-monitor-service:4015";
            proxy_pass $health_monitor_upstream;
        }

        location = /api/health-monitor {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            set $health_monitor_upstream "http://health-monitor-service:4015";
            proxy_pass $health_monitor_upstream;
        }

        location /api/health-monitor/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            set $health_monitor_upstream "http://health-monitor-service:4015";
            proxy_pass $health_monitor_upstream;
        }

        # -------- TENANT ROUTER --------
        location /tenant/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            proxy_pass http://tenant_router;
        }

        # Optional /api-prefixed tenant paths (for deployments that don't strip /api upstream)
        location /api/tenant/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://tenant_router;
        }

        # -------- PROTECTED ANALYTICS ROUTES --------
        location /analytics/ {
            access_by_lua_block {
                local t0 = ngx.now()
                local auth = require("auth")
                auth.authenticate()
                local t1 = ngx.now()

                local ratelimit = require("ratelimit")
                ratelimit.enforce()
                local t2 = ngx.now()

                ngx.log(ngx.NOTICE, string.format("[gw-timing] auth=%.3fms rate=%.3fms",
                    (t1 - t0) * 1000, (t2 - t1) * 1000))
            }

            # Strip /analytics prefix and forward to analytics root
            proxy_pass http://analytics_service/;
        }

        # -------- ALERTS SERVICE (author-only) --------
        # Handle /alerts without redirect to avoid scheme/port rewrite issues.
        location = /alerts {
            access_by_lua_block {
                local t0 = ngx.now()
                local auth = require("auth")
                auth.authenticate()
                local t1 = ngx.now()

                local ratelimit = require("ratelimit")
                ratelimit.enforce()
                local t2 = ngx.now()

                ngx.log(ngx.NOTICE, string.format("[gw-timing] auth=%.3fms rate=%.3fms",
                    (t1 - t0) * 1000, (t2 - t1) * 1000))
            }

            proxy_pass http://alerts_service/alerts;
        }

        location /alerts/ {
            access_by_lua_block {
                local t0 = ngx.now()
                local auth = require("auth")
                auth.authenticate()
                local t1 = ngx.now()

                local ratelimit = require("ratelimit")
                ratelimit.enforce()
                local t2 = ngx.now()

                ngx.log(ngx.NOTICE, string.format("[gw-timing] auth=%.3fms rate=%.3fms",
                    (t1 - t0) * 1000, (t2 - t1) * 1000))
            }

            proxy_pass http://alerts_service/alerts/;
        }

        # -------- PUSH NOTIFICATIONS (alerts-service) --------
        location /push/ {
            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()
            }

            proxy_pass http://alerts_service/push/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -------- SESSIONS SERVICE --------
        location /sessions {

            access_by_lua_block {
                local auth = require("auth")
                auth.authenticate()

                local ratelimit = require("ratelimit")
                ratelimit.enforce()
                ngx.header["X-Session-Debug-Hit"] = "true"
            }


            # Strip /sessions prefix if the service expects root or handles /sessions
            # My current sessions-service handles /sessions in app.js (app.use('/sessions', ...))
            # So I should forward /sessions to the service.
            proxy_pass http://sessions_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -------- PUBLIC TRACKING ROUTE (alerts-service) --------

        location /track {
            # No authentication block here to make it public
            
            # Optional: Add rate limiting for public endpoints
            access_by_lua_block {
                local ratelimit = require("ratelimit")
                ratelimit.enforce()
            }
            
            proxy_pass http://alerts_service/track;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -------- PUBLIC EVENT COUNT ROUTE (alerts-service) --------

        location /events {
            # No authentication block here to make it public

            access_by_lua_block {
                local ratelimit = require("ratelimit")
                ratelimit.enforce()
            }

            proxy_pass http://alerts_service/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /inventory {
            # Bypasses gateway authentication entirely
            # Alerts-service handles x-pipeline-key verification
            proxy_pass http://alerts_service/inventory;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
