<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datum — UI revamp (all panels)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Datum UI v2 — light-first, structural revamp. Add .dark on .app for dark mode. */
.app{
  --bg:#F5F6F5;--side:#FBFCFB;--panel:#FFFFFF;--sunk:#F1F3F2;--hover:#F4F6F5;
  --line:#E3E7E5;--line-2:#D1D8D4;
  --text:#0E1712;--text-2:#3A4741;--muted:#5D6B64;
  --accent:#0F7A50;--accent-hi:#0B6341;--accent-soft:#E6F2EC;--accent-ink:#FFFFFF;--accent-line:#9FCDB7;
  --good:#127A4A;--bad:#C0392B;--warn:#8F5E00;--info:#1F5FC4;
  --good-bg:#E5F3EB;--bad-bg:#FBEAE7;--warn-bg:#FBF1DD;--info-bg:#E8EFFB;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;
  --prev:#B5BFBA;--grid:#EDF0EE;--scrim:rgba(14,23,18,.42);
  --shadow:0 1px 2px rgba(14,23,18,.05);
  color-scheme:light;
}
.app.dark{
  --bg:#0A0D0B;--side:#0D110F;--panel:#111614;--sunk:#0C100E;--hover:#161D19;
  --line:#1E2823;--line-2:#2B3731;
  --text:#E8EEEA;--text-2:#B5C1BA;--muted:#8E9C95;
  --accent:#3FB68B;--accent-hi:#5CC9A0;--accent-soft:rgba(63,182,139,.13);--accent-ink:#04130C;--accent-line:rgba(63,182,139,.45);
  --good:#4CC38A;--bad:#F07A6E;--warn:#E5B04B;--info:#6EA8FE;
  --good-bg:rgba(76,195,138,.13);--bad-bg:rgba(240,122,110,.13);--warn-bg:rgba(229,176,75,.13);--info-bg:rgba(110,168,254,.13);
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;
  --prev:#4F5E56;--grid:#19221E;--scrim:rgba(0,0,0,.6);--shadow:none;
  color-scheme:dark;
}
.app{container-type:inline-size;container-name:app;position:relative;background:var(--bg);color:var(--text);font-family:Geist,Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
.app *{box-sizing:border-box}
.app sc-for,.app sc-if{display:contents}
.app a{color:var(--accent);text-decoration:none}
.app a:hover{text-decoration:underline}
.app h1,.app h2,.app h3,.app p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-size:12px}
.muted{color:var(--muted)}
.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:13px;height:13px}
.app.locked{height:min(100vh,860px);overflow:hidden}

/* Shell */
.shell{display:flex;min-height:100%;align-items:stretch}
.side{flex:none;width:260px;background:var(--side);border-right:1px solid var(--line);z-index:50}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{width:100%;max-width:1320px;margin:0 auto;padding:8px 32px 56px;display:flex;flex-direction:column;gap:20px}
.scrim{display:none;border:0;padding:0;margin:0}

/* Sidebar */
.nav-wrap{display:flex;flex-direction:column;height:100%;min-height:100%}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font-weight:650;font-size:16px;letter-spacing:-.02em;color:var(--text)}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tenant{margin:6px 12px 8px;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:calc(100% - 24px);font:inherit;color:inherit;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.tenant:hover{border-color:var(--line-2)}
.tenant-av{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.jump{margin:0 12px 6px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:13px;border:1px solid transparent;width:calc(100% - 24px);font-family:inherit;cursor:pointer}
.kbd{margin-left:auto;font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--muted);font-family:"Geist Mono",monospace}
.nav{display:flex;flex-direction:column;padding:6px 10px 16px;flex:1}
.nav-g{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;color:var(--text-2)!important;font-size:13.5px;font-weight:500;text-decoration:none!important}
.nav-i:hover{background:var(--hover);color:var(--text)!important}
.nav-i .i{color:var(--muted)}
.nav-i.on{background:var(--accent-soft);color:var(--accent)!important;font-weight:600}
.nav-i.on .i{color:var(--accent)}
.me{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:var(--sunk);border:1px solid var(--line-2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;height:56px;padding:0 32px;border-bottom:1px solid var(--line);background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.crumbs b{color:var(--text);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-right:6px;white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.badge-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}

/* Page header & filters */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px}
.h1{font-size:26px;font-weight:650;letter-spacing:-.025em;line-height:1.15}
.desc{color:var(--muted);font-size:13.5px;margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.pill{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font:inherit;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.pill:hover{border-color:var(--muted)}
.pill .k{color:var(--muted);font-weight:450}
.pill .i{color:var(--muted)}
.pill.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.mfbar{display:none}
.sheet-h,.sheet-f{display:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);font:inherit;font-size:13px;font-weight:550;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);text-decoration:none!important}
.btn:hover{background:var(--hover)}
.btn .i{color:var(--muted)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)!important}
.btn-primary:hover{background:var(--accent-hi)}
.btn-primary .i{color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-icon{width:32px;padding:0;position:relative}
.btn-sm{height:28px;font-size:12.5px;padding:0 10px}
.btn-sm.btn-icon{width:28px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sunk);border:1px solid var(--line);gap:2px}
.seg button{height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:550;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line-2),var(--shadow)}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);min-width:240px;color:var(--muted)}
.search input{border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;outline:none;width:100%}
.search input::placeholder{color:var(--muted)}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph.flat{border-bottom:0;padding-bottom:0}
.pt{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.ps{font-size:12.5px;color:var(--muted);margin-top:2px}
.pb{padding:18px}
.pf{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:14px;padding:10px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sec-t{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Metric grid (connected cells) */
.mg{display:grid;gap:1px;background:var(--line);grid-template-columns:repeat(4,minmax(0,1fr))}
.mg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mg.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.mg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mg.c4b{grid-template-columns:repeat(4,minmax(0,1fr))}
.mc{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;font:inherit;color:inherit;border:0;position:relative}
button.mc{cursor:pointer}
button.mc:hover{background:var(--hover)}
.mc.sel{background:var(--accent-soft)}
.mc.sel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.ml{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;justify-content:space-between}
.mv{font-size:24px;font-weight:620;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--text)}
.mv small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.md{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.d{display:inline-flex;align-items:center;gap:2px;font-weight:600;font-variant-numeric:tabular-nums}
.d.good{color:var(--good)}.d.bad{color:var(--bad)}.d.flat{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--sunk);color:var(--text-2);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.src{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.src span{font-size:10px;font-weight:600;padding:1px 5px;color:var(--muted)}
.src span.on{background:var(--text);color:var(--panel)}

/* Layout grids */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.gw{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}

/* Data viz bits */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.ln{height:2px;width:14px;border-radius:1px}
.sw.dash{height:0;width:14px;border-top:2px dashed var(--prev);border-radius:0}
.track{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;width:100%;display:block}
.track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.stackbar{display:flex;gap:2px;height:12px;border-radius:4px;overflow:hidden}
.stackbar i{display:block;height:100%}
.axis{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;line-height:0;font-variant-numeric:tabular-nums;flex:none}
.plot{position:relative;flex:1;min-width:0}
.gridlines{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.gridlines i{height:1px;background:var(--grid);display:block}
.gridlines i:last-child{background:var(--line-2)}
.xlab{display:grid;text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.tip{position:absolute;top:4px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;min-width:160px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:5;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px;background:var(--sunk);border-radius:10px}
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;background:var(--warn-bg);color:var(--text);font-size:13px;flex-wrap:wrap}
.note .i{color:var(--warn);margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 12px;font-size:13px;font-weight:550;color:var(--muted)!important;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none!important}
.tabs a.on{color:var(--text)!important;border-bottom-color:var(--accent)}

/* Tables (div-based) */
.tw{overflow-x:auto}
div.tbl{display:table;width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl .thead{display:table-header-group}
.tbl .tbody{display:table-row-group}
.tbl .tr{display:table-row}
.tbl .th{display:table-cell;font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk);vertical-align:middle}
.tbl .td{display:table-cell;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl.dense .td{padding:8px 14px}
.tbl .r{text-align:right}
.tbl .td.m{color:var(--muted)}
.tbl .td.url{max-width:440px;overflow:hidden;text-overflow:ellipsis;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;color:var(--text-2)}
.tbl .tbody .tr:hover .td{background:var(--hover)}
.tbl .tbody .tr:last-child .td{border-bottom:0}
.tbl .tr.grp .td{background:var(--sunk);font-weight:650}
.tbl .tr.grp .td.lead{color:var(--text)}
.sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
.cellbar{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.cellbar .track{width:80px;height:5px}

/* Mobile list (replaces tables on phones) */
.mlist{display:none}
.mrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow-l{min-width:0;flex:1}
.mrow-t{font-weight:550;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow-t.mono{font-size:12.5px;font-weight:500}
.mrow-s{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums}
.mrow-r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.mrow-v{font-weight:600;font-size:14px}
.m-only{display:none!important}

/* ---------- Phone ---------- */
@container app (max-width: 760px){
  .d-only{display:none!important}
  .m-only{display:revert!important}
  .mlist{display:block}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86%);transform:translateX(-105%);transition:transform .2s ease;box-shadow:none;overflow-y:auto}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:45;cursor:pointer;width:100%}
  .top{height:52px;padding:0 8px 0 4px;position:sticky;top:0;z-index:20}
  .top .crumbs .cr-path{display:none}
  .content{padding:0 12px 40px;gap:14px}
  .phead{padding-top:12px}
  .phead .h1,.phead .desc{display:none}
  .phead .meta{margin-top:0}
  .mfbar{display:flex;gap:8px;align-items:center}
  .mfbar .grow{flex:1;justify-content:flex-start;min-width:0;overflow:hidden}
  .fbar{display:none}
  .fbar.open{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;flex-direction:column;align-items:stretch;gap:10px;background:var(--panel);border:0;border-radius:16px 16px 0 0;padding:8px 16px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .fbar.open .pill{width:100%;height:44px;justify-content:space-between;font-size:14px}
  .fbar.open .pill .k{margin-right:auto}
  .fbar.open .sep{display:none}
  .fbar.open .seg{width:100%}
  .fbar.open .seg button{flex:1;height:36px}
  .fbar.open .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
  .fbar.open .sheet-h::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line-2);transform:translateX(-50%)}
  .fbar.open .sheet-f{display:flex;gap:8px;padding-top:6px}
  .fbar.open .sheet-f .btn{flex:1;height:44px}
  .fbar .d-only{display:none!important}
  .mg,.mg.c4b{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mg.c6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mc{padding:11px 12px}
  .mv{font-size:19px}
  .ml{font-size:12px}
  .g2,.g3,.gw{grid-template-columns:minmax(0,1fr);gap:14px}
  .ph{padding:12px 14px}
  .pb{padding:14px}
  .pf{padding:10px 14px;justify-content:space-between}
  .search{min-width:0;width:100%}
  .tw.d-only{display:none!important}
  .hide-m{display:none!important}
}
@container app (min-width: 761px) and (max-width: 1100px){
  .gw{grid-template-columns:minmax(0,1fr)}
  .mg.c6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}

html,body{margin:0;height:100%;background:#E9ECEA}
#stage{min-height:100vh}
#stage>.app{min-height:100vh}
#stage.phone{width:390px;margin:24px auto;min-height:844px;box-shadow:0 0 0 1px #D1D8D4,0 20px 60px rgba(0,0,0,.18);border-radius:20px;overflow:hidden}
#stage.phone>.app{min-height:844px}

<script type="text/x-tpl" id="tpl-Main">

<div class="main">
<dc-import name="Topbar" embedded="{{ true }}" section="Overview" title="Dashboard" updated="Updated 7 min ago" theme="{{theme}}" on-toggle="{{toggleTheme}}" on-menu="{{openDrawer}}" hint-size="100%,56px"></dc-import>

<header class="phead">

<div class="mfbar">

<button class="pill"><span class="k">Date</span>Nov 23, 2026<svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>

<div class="sheet-f"><button class="btn">Reset</button><button class="btn btn-primary" onClick="{{closeSheet}}">Show results</button></div>
</div>

<section class="panel" aria-label="Key metrics">
<div class="ph">
<div><h2 class="pt">Today's performance</h2><p class="ps">vs yesterday · page 1 of 2</p></div>
<div class="row">

<button class="btn btn-sm btn-icon" aria-label="Next metrics"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
<div class="mg">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="8">
<div class="{{k.cls}}">
<div class="ml"><span>{{k.label}}</span><span class="row" style="gap: 4px"><sc-if value="{{k.hasSrc}}" hint-placeholder-val="{{ false }}"><span class="src" title="Data source"><span class="{{k.s1c}}">{{k.s1}}</span><span class="{{k.s2c}}">{{k.s2}}</span></span></sc-if><button class="btn btn-ghost btn-sm btn-icon hide-m" style="width: 22px; height: 22px" aria-label="Pin {{k.label}}"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"></path></svg></button></span></div>
<div class="mv">{{k.val}}</div>
<div class="md"><span class="{{k.dcls}}">{{k.d}}</span></div>
</div>
</sc-for>
</div>
<div class="pb" style="border-top: 1px solid var(--line)">
<div class="between wrap" style="margin-bottom: 14px">
<div><h3 class="pt" style="font-size: 13.5px">Gross revenue by hour</h3><div class="legend" style="margin-top: 6px"><span><i class="sw ln" style="background: var(--accent)"></i>Nov 23, 2026</span><span><i class="sw dash"></i>Nov 22, 2026</span></div></div>
<div class="row d-only"><div class="seg" role="group" aria-label="Granularity"><button class="on">Hourly</button><button>Daily</button></div><div class="seg" role="group" aria-label="Chart type"><button class="on">Line</button><button>Bar</button></div></div>
</div>
<div style="display: flex; gap: 10px">
<div class="axis" style="height: 220px; width: 40px"><span>₹1L</span><span>₹75K</span><span>₹50K</span><span>₹25K</span><span>₹0</span></div>
<div style="flex: 1; min-width: 0">
<div class="plot" style="height: 220px">
<div class="gridlines"><i></i><i></i><i></i><i></i><i></i></div>
<svg viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
<path d="{{prevPath}}" fill="none" style="stroke: var(--prev); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke"></path>
<path d="{{curArea}}" style="fill: var(--accent); opacity: .08"></path>
<path d="{{curPath}}" fill="none" style="stroke: var(--accent); stroke-width: 2.2; vector-effect: non-scaling-stroke; stroke-linejoin: round"></path>
</svg>
<sc-if value="{{hasHover}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); left: {{hov.left}}"></div>
<div style="position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--prev); box-shadow: 0 0 0 2px var(--panel); transform: translate(-50%, -50%); left: {{hov.left}}; top: {{hov.prevTop}}"></div>
<div style="position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); transform: translate(-50%, -50%); left: {{hov.left}}; top: {{hov.curTop}}"></div>
<div class="tip" style="left: {{hov.tipLeft}}">
<div style="font-weight: 600; margin-bottom: 4px">{{hov.label}}</div>
<div class="between"><span class="row" style="gap: 6px"><i class="sw ln" style="background: var(--accent)"></i>Nov 23</span><b>{{hov.cur}}</b></div>
<div class="between"><span class="row muted" style="gap: 6px"><i class="sw dash"></i>Nov 22</span><span>{{hov.prev}}</span></div>
</div>
</sc-if>
<div style="position: absolute; top: 0; bottom: 0; left: -5%; right: -5%; display: flex" onMouseLeave="{{clearHover}}">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="11"><div style="flex: 1" onMouseEnter="{{h.enter}}"></div></sc-for>
</div>
</div>
<div style="position: relative; height: 18px; margin-top: 8px; font-size: 11px; color: var(--muted)">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="11"><span class="{{h.cls}}" style="position: absolute; transform: translateX(-50%); left: {{h.left}}">{{h.label}}</span></sc-for>
</div>
</div>
</div>
</div>
</section>

<div class="gw">
<section class="panel">
<div class="ph"><div><h2 class="pt">Mode of payment</h2><p class="ps">Today's orders and sales by payment type</p></div></div>

<div>
<div class="between" style="margin-bottom: 6px; font-size: 12.5px"><span class="muted">{{b.label}}</span><b class="num">{{b.total}}</b></div>
<div class="stackbar" role="img" aria-label="{{b.aria}}"><i style="background: var(--c1); width: {{b.w0}}"></i><i style="background: var(--c2); width: {{b.w1}}"></i><i style="background: var(--c3); width: {{b.w2}}"></i></div>
</div>
</sc-for>
</div>
<div class="tw" style="border: 1px solid var(--line); border-radius: 10px">
<div role="table" class="tbl">
<div role="rowgroup" class="thead"><div role="row" class="tr"><div role="columnheader" class="th">Payment type</div><div role="columnheader" class="th r">Orders</div><div role="columnheader" class="th r">Share</div><div role="columnheader" class="th r">Sales</div><div role="columnheader" class="th r">Share</div></div></div>
<div role="rowgroup" class="tbody">
<sc-for list="{{payRows}}" as="p" hint-placeholder-count="3">
<div role="row" class="tr"><div role="cell" class="td"><span class="row"><i class="sw" style="background: {{p.color}}"></i>{{p.label}}</span></div><div role="cell" class="td r"><b style="font-weight: 600">{{p.o}}</b></div><div role="cell" class="td r m">{{p.op}}</div><div role="cell" class="td r"><b style="font-weight: 600">{{p.s}}</b></div><div role="cell" class="td r m">{{p.sp}}</div></div>
</sc-for>
</div>
</div>
</div>
</div>
</section>

<section class="panel" style="display: flex; flex-direction: column">
<div class="ph"><div><h2 class="pt">Web performance</h2><p class="ps">Average score across tracked pages</p></div></div>
<div class="pb" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<div class="row" style="align-items: baseline; gap: 10px"><span class="num" style="font-size: 44px; font-weight: 620; letter-spacing: -.03em">66.6</span><span class="muted">/ 100</span><span class="d good" style="margin-left: auto">↑ 2.42%</span></div>

<div style="position: absolute; top: -4px; left: 66.6%; width: 3px; height: 16px; border-radius: 2px; background: var(--text); transform: translateX(-50%)"></div>

</div>
</section>
</div>

<div class="gw">
<section class="panel">
<div class="ph"><div><h2 class="pt">Top 5 pages by First Contentful Paint</h2><p class="ps">Change vs yesterday · lower is faster</p></div><div class="seg" role="group" aria-label="Metric"><button class="on">FCP</button><button>LCP</button><button>TTFB</button></div></div>
<div>
<sc-for list="{{pages}}" as="pg" hint-placeholder-count="5">

<span class="num muted" style="width: 16px; font-size: 12px">{{pg.n}}</span>
<div class="mrow-l"><div class="mono" style="color: var(--text-2); word-break: break-all; line-height: 1.45">{{pg.path}}</div></div>
<div class="mrow-r"><div class="mrow-v">{{pg.fcp}}</div><div class="{{pg.dcls}}" style="font-size: 12px">{{pg.d}}</div></div>
</div>
</sc-for>
</div>
</section>

<section class="panel">
<div class="ph"><div><h2 class="pt">Traffic split</h2><p class="ps">Sessions by source group</p></div><div class="seg" role="group" aria-label="Measure"><button class="on">Sessions</button><button>Orders</button></div></div>
<div class="pb stack" style="gap: 14px">
<div class="row" style="align-items: baseline; gap: 8px"><span class="num" style="font-size: 28px; font-weight: 620; letter-spacing: -.02em">21.1K</span><span class="muted" style="font-size: 12.5px">total sessions</span></div>
<div class="stackbar" style="height: 10px" role="img" aria-label="Meta 51.9%, Google 26.2%, Direct 18.3%, Others 3.6%"><i style="background: var(--c1); width: 51.9%"></i><i style="background: var(--c2); width: 26.2%"></i><i style="background: var(--c3); width: 18.3%"></i><i style="background: var(--c4); width: 3.6%"></i></div>

<sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
<div class="between num" style="padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px"><span class="row"><i class="sw" style="background: {{s.color}}"></i>{{s.label}}</span><span class="row" style="gap: 14px"><b style="font-weight: 600">{{s.v}}</b><span class="muted" style="width: 46px; text-align: right">{{s.pct}}</span></span></div>
</sc-for>
</div>
</div>
</section>
</div>

<section class="panel">
<div class="ph">
<div><h2 class="pt">Mode of payment · day-wise order share</h2><div class="legend" style="margin-top: 6px"><span><i class="sw ln" style="background: var(--accent)"></i>Nov 23, 2026</span><span><i class="sw dash"></i>Nov 22, 2026</span></div></div>
<div class="row wrap">
<div class="seg" role="group" aria-label="Payment type"><button class="on">Prepaid</button><button>COD</button><button>Partially paid</button></div>
<div class="seg d-only" role="group" aria-label="Measure"><button class="on">Order count</button><button>Sales</button></div>
</div>
</div>
<div class="pb">
<div style="display: flex; gap: 10px">
<div class="axis" style="height: 150px; width: 34px"><span>60%</span><span>45%</span><span>30%</span><span>15%</span><span>0%</span></div>
<div style="flex: 1; min-width: 0">
<div class="plot" style="height: 150px">
<div class="gridlines"><i></i><i></i><i></i><i></i><i></i></div>
<div style="position: absolute; left: 50%; top: 21.7%; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); transform: translate(-50%, -50%)"></div>
<div class="num" style="position: absolute; left: 50%; top: 21.7%; transform: translate(12px, -130%); font-size: 12px; font-weight: 600">Prepaid 47.0%</div>
</div>
<div style="text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px">Nov 23</div>

</main>
<footer class="between wrap" style="padding: 16px 32px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); margin-top: auto"><span>© 2026 Datum. All rights reserved.</span><span class="row" style="gap: 16px"><a href="#">Privacy</a><a href="#">Terms</a><a href="#">Support</a></span></footer>

<script>
// Minimal renderer for the Datum templates: {{holes}}, <sc-for>, <sc-if>, <dc-import>, on* events.
var COMPONENTS = {};
var APP = { theme: 'light', page: 'Main', inst: null, rerender: function () {} };

function DCLogic(props) { this.props = props || {}; this.state = {}; }
DCLogic.prototype.setState = function (patch) {
  var changed = false;
  for (var k in patch) { if (this.state[k] !== patch[k]) { changed = true; } }
  Object.assign(this.state, patch);
  if ('theme' in patch && patch.theme) APP.theme = patch.theme;
  if (changed) APP.rerender();
};
DCLogic.prototype.forceUpdate = function () { APP.rerender(); };

var HOLE_ONLY = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;

function lookup(expr, scope) {
  expr = expr.trim();
  if (expr === 'true') return true;
  if (expr === 'false') return false;
  if (expr === 'null') return null;
  if (/^-?\d+(\.\d+)?$/.test(expr)) return Number(expr);
  if (/^'.*'$/.test(expr) || /^".*"$/.test(expr)) return expr.slice(1, -1);
  var parts = expr.split('.'), v = scope;
  for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
  return v;
}
function interp(str, scope) {
  return str.replace(HOLE, function (_, e) { var v = lookup(e, scope); return v == null ? '' : String(v); });
}
function attrVal(str, scope) {
  var m = str.match(HOLE_ONLY);
  return m ? lookup(m[1], scope) : interp(str, scope);
}
function camel(s) { return s.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }); }

var tplCache = {};
function tplFor(name) {
  if (!tplCache[name]) {
    var t = document.createElement('template');
    t.innerHTML = document.getElementById('tpl-' + name).textContent;
    tplCache[name] = t.content;
  }
  return tplCache[name];
}

function renderComponent(name, props) {
  var Cls = COMPONENTS[name];
  var inst = new Cls(props);
  return { inst: inst, nodes: renderChildren(tplFor(name), inst.renderVals()) };
}

function renderChildren(parent, scope) {
  var out = [];
  parent.childNodes.forEach(function (n) { renderNode(n, scope).forEach(function (x) { out.push(x); }); });
  return out;
}

var EVENTS = { onclick: 'click', onmouseenter: 'mouseenter', onmouseleave: 'mouseleave', onfocus: 'focus', onblur: 'blur', onchange: 'change', oninput: 'input' };

function renderNode(n, scope) {
  if (n.nodeType === 3) return [document.createTextNode(interp(n.nodeValue, scope))];
  if (n.nodeType !== 1) return [];
  var tag = n.localName;
  if (tag === 'sc-for') {
    var list = attrVal(n.getAttribute('list') || '', scope) || [];
    var as = n.getAttribute('as') || 'item', res = [];
    list.forEach(function (item, i) {
      var s = Object.create(scope); s[as] = item; s.$index = i;
      renderChildren(n, s).forEach(function (x) { res.push(x); });
    });
    return res;
  }
  if (tag === 'sc-if') {
    return attrVal(n.getAttribute('value') || '', scope) ? renderChildren(n, scope) : [];
  }
  if (tag === 'dc-import') {
    var props = {};
    Array.prototype.forEach.call(n.attributes, function (a) {
      if (a.name === 'name' || a.name.indexOf('hint-') === 0) return;
      props[camel(a.name)] = attrVal(a.value, scope);
    });
    return renderComponent(n.getAttribute('name'), props).nodes;
  }
  var el = document.createElementNS(n.namespaceURI, tag);
  Array.prototype.forEach.call(n.attributes, function (a) {
    var ev = EVENTS[a.name.toLowerCase()];
    if (ev) {
      var fn = attrVal(a.value, scope);
      if (typeof fn === 'function') el.addEventListener(ev, function (e) {
        if (ev === 'click' && el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
        fn(e);
      });
      return;
    }
    var v = attrVal(a.value, scope);
    if (v === false || v == null) return;
    el.setAttribute(a.name, v === true ? '' : String(v));
  });
  renderChildren(n, scope).forEach(function (c) { el.appendChild(c); });
  return [el];
}

function boot(pageNames) {
  var stage = document.getElementById('stage');
  var sel = document.getElementById('dz-page');
  var desk = document.getElementById('dz-desk'), phone = document.getElementById('dz-phone');

  function draw() {
    var inst = APP.inst;
    var nodes = renderChildren(tplFor(APP.page), inst.renderVals());
    stage.replaceChildren.apply(stage, nodes);
  }
  APP.rerender = draw;

  function go(name, keepScroll) {
    if (pageNames.indexOf(name) < 0) name = 'Main';
    APP.page = name;
    APP.inst = new COMPONENTS[name]({ theme: APP.theme });
    sel.value = name;
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
    draw();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  // Sidebar links point at "<Page>.dc.html" — route them inside this file.
  stage.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    var href = a.getAttribute('href');
    var m = href.match(/^([A-Za-z]+)\.dc\.html$/);
    if (m) { e.preventDefault(); go(m[1]); }
    else if (href === '#') e.preventDefault();
  });
  sel.addEventListener('change', function () { go(sel.value); });
  desk.addEventListener('click', function () { stage.classList.remove('phone'); desk.classList.add('on'); phone.classList.remove('on'); });
  phone.addEventListener('click', function () { stage.classList.add('phone'); phone.classList.add('on'); desk.classList.remove('on'); });
  window.addEventListener('hashchange', function () { var n = location.hash.slice(1); if (n && n !== APP.page) go(n); });

  go(location.hash.slice(1) || 'Main');
}
