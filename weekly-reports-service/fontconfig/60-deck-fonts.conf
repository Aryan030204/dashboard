<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Maps the font names Google Slides / Canva write into a PPTX onto the font files in ../fonts.
  The deck says "Bebas Neue Cyrillic", "Poppins Bold", "Poppins Semi-Bold", "Alexandria Bold", "Inter Bold",
  but the installed families are "Bebas Neue", "Poppins" (+ weight), "Alexandria" and "Inter", so without these
  rules LibreOffice cannot find them by name and substitutes a different font.
  Installed by the worker image into /etc/fonts/conf.d/.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>Bebas Neue Cyrillic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Bebas Neue</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Poppins Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Poppins</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Poppins Semi-Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Poppins</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>demibold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Poppins Medium</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Poppins</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Alexandria Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Alexandria</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Inter Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
</fontconfig>
